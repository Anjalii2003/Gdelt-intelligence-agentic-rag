
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: gdelt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gdelt_rag
      POSTGRES_USER: gdelt_user
      POSTGRES_PASSWORD: change_this_local_password
    ports:
      - "5432:5432"
    volumes:
      - gdelt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdelt_user -d gdelt_rag"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gdelt_postgres_data:
